<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#10142a" />
<title>Kundalik namozlar</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #1c2440 0%, #10142a 55%, #0a0d1c 100%);
    color: #F1EDE3;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 16px 10px;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .topbar { width: 100%; max-width: 380px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; flex-shrink: 0; }
  .topbar svg { width: 20px; height: 20px; color: #C9CEDD; }
  .topbar .topbar-title { font-size: 16px; font-weight: 700; color: #F1EDE3; }
  .header { text-align: center; margin-bottom: 0; flex-shrink: 0; }
  .header .leaf-badge { width: 18px; height: 18px; margin: 0 auto 3px; color: #6FA352; opacity: 0.9; }
  .daycount { font-size: 11.5px; letter-spacing: 0.01em; color: #A8AFC2; margin-bottom: 0; line-height: 1.25; }
  .daycount b { color: #6FA352; font-weight: 700; }
  .title { display: none; }
  .sky-stage { position: relative; width: 100%; max-width: 260px; height: 168px; margin: 0 auto; flex-shrink: 0; }
  .clouds { position: absolute; top: 0; left: 0; width: 100%; height: 60px; pointer-events: none; }
  .cloud { position: absolute; }
  .cloud svg { display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.28)); }
  .cloud.c1 { top: 0px;  left: 4px;   width: 62px; animation: driftA 22s ease-in-out infinite; }
  .cloud.c2 { top: -2px;  left: 84px; width: 50px; animation: driftB 27s ease-in-out infinite; animation-delay: -8s; }
  .cloud.c3 { top: 12px; left: 148px; width: 44px; animation: driftA 18s ease-in-out infinite; animation-delay: -4s; }
  @keyframes driftA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(13px,-4px); } }
  @keyframes driftB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-15px,3px); } }
  .rain-layer { position: absolute; top: 24px; left: 0; width: 100%; height: 100px; pointer-events: none; overflow: visible; }
  .raindrop {
    position: absolute; width: 2px; height: 13px; border-radius: 2px; top: 0;
    background: linear-gradient(to bottom, rgba(185,213,255,0.95), rgba(185,213,255,0));
    animation: rainfall 1.05s linear forwards;
  }
  @keyframes rainfall { 0% { transform: translateY(0); opacity: 0.9; } 100% { transform: translateY(115px); opacity: 0; } }
  .tree-wrap {
    position: relative; width: 172px; max-width: 58vw; margin: 8px auto 0;
    transform-origin: 50% 100%;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .tree-stage { display: block; width: 100%; transform-origin: 50% 100%; }
  .tree-stage.grow-pulse { animation: growPulse 0.4s cubic-bezier(.34,1.56,.64,1); }
  .tree-stage.shrink-pulse { animation: shrinkPulse 0.35s ease; }
  @keyframes growPulse { 0% { transform: scale(1); } 45% { transform: scale(1.09); } 100% { transform: scale(1); } }
  @keyframes shrinkPulse { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
  .tree-stage svg {
    display: block; width: 100%; height: auto; overflow: visible;
    transform-origin: 50% 100%;
    animation: treeSway 6s ease-in-out infinite;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
  }
  @keyframes treeSway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }
  .sky-stage.glow .tree-stage svg { filter: drop-shadow(0 0 14px rgba(242, 200, 121, 0.55)); }
  .growth-leaves { position: absolute; inset: 0; pointer-events: none; }
  .growth-leaf {
    position: absolute; width: 15px; height: 15px; opacity: 0;
    transform: scale(0.2) rotate(var(--rot, 0deg));
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .growth-leaf svg { width: 100%; height: 100%; filter: drop-shadow(0 0 3px rgba(183,226,140,0.7)); }
  .growth-leaf.show { opacity: 1; animation: leafWobble 3.2s ease-in-out infinite; }
  @keyframes leafWobble {
    0%, 100% { transform: scale(1) rotate(calc(var(--rot, 0deg) - 5deg)); }
    50% { transform: scale(1) rotate(calc(var(--rot, 0deg) + 5deg)); }
  }
  .sparkle-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
  .sparkle {
    position: absolute; font-size: 15px; line-height: 1;
    animation: sparkleUp 1s ease-out forwards;
  }
  @keyframes sparkleUp {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-70px) scale(1.1); opacity: 0; }
  }
  .today-leaves {
    display: flex; gap: 8px; justify-content: center; align-items: center;
    margin: 4px 0 0; flex-shrink: 0;
  }
  .today-leaf {
    width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    color: rgba(241,237,227,0.22); transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), color 0.25s ease;
  }
  .today-leaf svg { width: 100%; height: 100%; }
  .today-leaf.done { color: #6FA352; }
  .today-leaf.pop { animation: leafPop 0.45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes leafPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.55) rotate(-8deg); }
    100% { transform: scale(1); }
  }
  .leaf-fall {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 2px 8px 2px 8px;
    background: #7FAE5E;
    top: 80px;
    animation: fall 1.1s ease-in forwards;
    opacity: 0.9;
    pointer-events: none;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(110px) rotate(220deg); opacity: 0; }
  }
  .progress-pill {
    width: 100%; max-width: 360px; display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.045); border: 1px solid rgba(241,237,227,0.08);
    border-radius: 999px; padding: 7px 14px; margin: 6px 0; flex-shrink: 0;
  }
  .progress-pill svg { width: 17px; height: 17px; flex-shrink: 0; color: #6FA352; }
  .progress-track { flex: 1; height: 7px; border-radius: 999px; background: rgba(241,237,227,0.12); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#6FA352,#8FB86A); border-radius: 999px; transition: width 0.3s ease; }
  .progress-count { font-size: 12px; font-weight: 700; color: #F1EDE3; white-space: nowrap; text-align: right; line-height: 1.2; }
  .progress-count span { display: block; font-size: 9.5px; font-weight: 500; color: #8B93AB; }
  .list { width: 100%; max-width: 360px; background: rgba(255,255,255,0.03); border: 1px solid rgba(241,237,227,0.07); border-radius: 16px; padding: 0 14px; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid rgba(241,237,227,0.07);
    cursor: pointer; user-select: none; gap: 10px;
  }
  .row:last-child { border-bottom: none; }
  .row-icon {
    width: 34px; height: 38px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .row-icon img { width: 100%; height: 100%; object-fit: contain; }
  .row-mid { flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .row-name { font-size: 14.5px; font-weight: 600; }
  .row-sub { font-size: 11px; color: #8B93AB; }
  .check {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    border: 1.5px solid rgba(241,237,227,0.28);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s ease;
  }
  .check.done { background: #6FA352; border-color: #6FA352; }
  .check svg { width: 14px; height: 14px; display: none; }
  .check.done svg { display: block; }
  .reward {
    margin-top: 6px; padding: 8px 16px; border-radius: 999px; flex-shrink: 0;
    background: rgba(242,200,121,0.12); border: 1px solid rgba(242,200,121,0.35);
    color: #F2C879; font-size: 11.5px; font-weight: 600; text-align: center;
  }
  .finish { margin-top: 10px; text-align: center; max-width: 320px; display: none; flex-shrink: 0; }
  .finish h3 { font-size: 17px; margin-bottom: 5px; color: #F2C879; }
  .finish p { font-size: 12px; color: #C9CEDD; line-height: 1.4; margin-bottom: 10px; }
  .btn {
    background: #E3A857; color: #10142a; border: none; border-radius: 999px;
    padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .bottom-nav {
    width: 100%; max-width: 360px; flex-shrink: 0; margin-top: 6px;
    background: rgba(20,24,45,0.92);
    border: 1px solid rgba(241,237,227,0.09); border-radius: 999px;
    display: flex; align-items: center; justify-content: space-around;
    padding: 9px 0; box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .bottom-nav .nav-item { display: flex; align-items: center; justify-content: center; padding: 3px 18px; color: #8B93AB; }
  .bottom-nav .nav-item svg { width: 20px; height: 20px; }
  .bottom-nav .nav-item.active { color: #6FA352; }
</style>
</head>
<body>

  <div class="topbar">
    <svg viewBox="0 0 24 24" fill="none" onclick="history.back()"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="topbar-title">Namoz daraxti</div>
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
  </div>

  <div class="header">
    <svg class="leaf-badge" viewBox="0 0 24 24" fill="none"><path d="M4 20C4 12 9 4 20 4C20 14 13 20 4 20Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 20C8 16 12 12 18 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <div class="daycount">Har bir namoz &ndash;<br/><b>daraxtingizning yangi shoxchasi</b></div>
  </div>

  <div class="sky-stage" id="skyStage">
    <div class="clouds">
      <div class="cloud c1">
        <svg viewBox="0 0 100 46" width="100" height="46">
          <defs><linearGradient id="cg1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#dee3ef"/><stop offset="100%" stop-color="#c7cfe2"/>
          </linearGradient></defs>
          <ellipse cx="30" cy="26" rx="26" ry="15" fill="url(#cg1)"/>
          <ellipse cx="56" cy="19" rx="19" ry="13" fill="url(#cg1)"/>
          <ellipse cx="73" cy="27" rx="15" ry="11" fill="url(#cg1)"/>
          <ellipse cx="16" cy="30" rx="13" ry="9" fill="url(#cg1)"/>
        </svg>
      </div>
      <div class="cloud c2">
        <svg viewBox="0 0 90 42" width="90" height="42">
          <defs><linearGradient id="cg2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#dee3ef"/><stop offset="100%" stop-color="#c7cfe2"/>
          </linearGradient></defs>
          <ellipse cx="26" cy="24" rx="22" ry="13" fill="url(#cg2)"/>
          <ellipse cx="50" cy="17" rx="16" ry="11" fill="url(#cg2)"/>
          <ellipse cx="65" cy="25" rx="12" ry="9" fill="url(#cg2)"/>
        </svg>
      </div>
      <div class="cloud c3">
        <svg viewBox="0 0 80 38" width="80" height="38">
          <defs><linearGradient id="cg3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#dee3ef"/><stop offset="100%" stop-color="#c7cfe2"/>
          </linearGradient></defs>
          <ellipse cx="22" cy="21" rx="19" ry="11" fill="url(#cg3)"/>
          <ellipse cx="43" cy="15" rx="14" ry="9" fill="url(#cg3)"/>
          <ellipse cx="58" cy="22" rx="11" ry="8" fill="url(#cg3)"/>
        </svg>
      </div>
    </div>
    <div class="rain-layer" id="rainLayer"></div>
    <div class="sparkle-layer" id="sparkleLayer"></div>
    <div class="tree-wrap" id="treeWrap">
      <div id="treeImg" class="tree-stage"></div>
      <div class="growth-leaves" id="growthLeaves"></div>
    </div>
  </div>

  <div class="today-leaves" id="todayLeaves"></div>

  <div class="progress-pill">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 21C12 14 12 9 12 4M12 4C9 4 6 7 6 11C9 11 12 8 12 4ZM12 9C14.5 9 17 11 17 14C14 14 12 12 12 9Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-count" id="progressCount">0 / 30<span>kun</span></div>
  </div>

  <div class="list" id="list"></div>

  <div class="reward" id="reward" style="display:none;">Bugungi mukofot: barcha 5 vaqt namoz to'liq bajarildi</div>

  <div class="finish" id="finish">
    <h3 id="finishTitle">Sikl yakunlandi</h3>
    <p id="finishText"></p>
    <button class="btn" onclick="startNewCycle()">Yangi sikl boshlash</button>

  <div class="bottom-nav">
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11M6 10V20H18V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20C4 12 9 4 20 4C20 14 13 20 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 20C8 16 12 12 18 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M5 19V11M12 19V5M19 19V14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></div>
  </div>

<script>
const PRAYERS = [
  { key: "bomdod", label: "Bomdod" },
  { key: "peshin", label: "Peshin" },
  { key: "asr", label: "Asr" },
  { key: "shom", label: "Shom" },
  { key: "xufton", label: "Xufton" },
];
const CYCLE_LEN = 30;
const EMPTY_RECORD = { bomdod:false, peshin:false, asr:false, shom:false, xufton:false };

function fmt(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function daysBetween(a,b){ const MS=86400000; const da=new Date(a.getFullYear(),a.getMonth(),a.getDate()); const db=new Date(b.getFullYear(),b.getMonth(),b.getDate()); return Math.round((db-da)/MS); }
function displayDate(s){ const [y,m,d]=s.split("-"); return `${d}.${m}.${y}`; }

function loadRecord(dateStr){
  try { const raw = localStorage.getItem("day:"+dateStr); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveRecord(dateStr, rec){
  try { localStorage.setItem("day:"+dateStr, JSON.stringify(rec)); } catch(e){}
}
function getCycleStart(todayStr){
  let s = localStorage.getItem("meta:cycle-start");
  if (!s) { s = todayStr; localStorage.setItem("meta:cycle-start", s); }
  return s;
}
function setCycleStart(s){ localStorage.setItem("meta:cycle-start", s); }

let today = new Date();
let todayStr = fmt(today);
let cycleStart = getCycleStart(todayStr);
let cycleStartDate = (()=>{ const [y,m,d]=cycleStart.split("-").map(Number); return new Date(y,m-1,d); })();
let dayIndex = daysBetween(cycleStartDate, today);
let cycleFinished = dayIndex >= CYCLE_LEN;
let elapsedCount = Math.min(dayIndex, CYCLE_LEN-1);
let cycleDates = Array.from({length:CYCLE_LEN}, (_,i)=>fmt(addDays(cycleStartDate,i)));
let todayRecord = loadRecord(todayStr) || {...EMPTY_RECORD};
let scores = {};
cycleDates.slice(0, elapsedCount+1).forEach(d=>{
  const rec = d===todayStr ? todayRecord : loadRecord(d);
  const done = rec ? PRAYERS.filter(p=>rec[p.key]).length : 0;
  scores[d] = done / PRAYERS.length;
});
let peekDate = null;

function overallProgress(){
  let sum = 0;
  cycleDates.forEach((d,i)=>{
    if (i > elapsedCount && d !== todayStr) return;
    sum += scores[d] ?? 0;
  });
  return sum / CYCLE_LEN;
}

function todayDoneCount(){ return PRAYERS.filter(p=>todayRecord[p.key]).length; }

const LEAF_TUFT = `<path d="M0 8C0 3.5 3.5 0 9 0C9 4.5 5.5 8 0 8Z" />`;

function leafTuft(x, y, scale, rot, fill){
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${scale})">
    <g fill="${fill}">${LEAF_TUFT}</g>
    <g fill="#ffffff" opacity="0.35" style="mix-blend-mode:soft-light" transform="translate(1.2,1) scale(0.6)">${LEAF_TUFT}</g>
  </g>`;
}

function trunkGrad(id){
  return `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6B4A30"/><stop offset="45%" stop-color="#8F6E48"/><stop offset="100%" stop-color="#573C26"/>
  </linearGradient>`;
}

function groundMound(id, cx, cy, rx, ry){
  return `<radialGradient id="${id}" cx="34%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#5F9448"/>
      <stop offset="45%" stop-color="#3E5C2E"/>
      <stop offset="100%" stop-color="#233A1B"/>
    </radialGradient>
    <ellipse cx="${cx}" cy="${cy+ry*0.6}" rx="${rx*1.08}" ry="${ry*0.6}" fill="#04060c" opacity="0.35"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${id})"/>
    <ellipse cx="${cx-rx*0.22}" cy="${cy-ry*0.4}" rx="${rx*0.42}" ry="${ry*0.32}" fill="#7FAE5E" opacity="0.45"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#1c2b14" stroke-width="1" opacity="0.4"/>`;
}

function pebble(x, y, r, rot, tone){
  const light = tone === 'warm' ? '#c7c2b6' : '#aeb4bb';
  const dark = tone === 'warm' ? '#8b8579' : '#767c83';
  return `<g transform="translate(${x},${y}) rotate(${rot})">
    <ellipse cx="0" cy="0" rx="${r}" ry="${r*0.72}" fill="${dark}"/>
    <ellipse cx="${-r*0.28}" cy="${-r*0.22}" rx="${r*0.44}" ry="${r*0.3}" fill="${light}" opacity="0.85"/>
  </g>`;
}

function grassTufts(cx, seed){
  const rand = (n)=> { const x = Math.sin(n*777)*10000; return x - Math.floor(x); };
  let out = "";
  for (let i=0;i<6;i++){
    const x = cx - 48 + i*19 + rand(seed+i)*6;
    const rot = -30 + rand(seed+i+3)*60;
    const c = i%2===0 ? '#5C8F44' : '#4C7A38';
    out += leafTuft(x, 244, 0.85 + rand(seed+i)*0.3, rot, c);
  }
  return out;
}

function canopyCluster(id, cx, cy, spread, count, fillA, fillB){
  // fillA = light facet, fillB = dark facet; mid tone is blended between them.
  const mid = fillA; // base fill under the facets
  const rand = (seed)=> { const x = Math.sin(seed*999)*10000; return x - Math.floor(x); };
  let defs = "";
  let blobs = "";
  for (let i=0;i<count;i++){
    const t = i/(count-1||1);
    const dx = (t-0.5)*spread;
    const dy = -Math.abs(dx)*0.35 + rand(i+1)*8 - 4;
    const rx = spread*0.24 * (0.8 + rand(i+7)*0.4);
    const ry = rx*0.85;
    const bx = cx+dx, by = cy+dy;
    const clipId = `${id}c${i}`;
    defs += `<clipPath id="${clipId}"><ellipse cx="${bx}" cy="${by}" rx="${rx}" ry="${ry}"/></clipPath>`;
    blobs += `<g clip-path="url(#${clipId})">
      <rect x="${bx-rx}" y="${by-ry}" width="${rx*2}" height="${ry*2}" fill="${mid}"/>
      <polygon points="${bx-rx},${by-ry} ${bx+rx*0.35},${by-ry} ${bx-rx},${by+ry*0.35}" fill="#ffffff" opacity="0.32"/>
      <polygon points="${bx+rx},${by+ry} ${bx-rx*0.3},${by+ry} ${bx+rx},${by-ry*0.3}" fill="${fillB}" opacity="0.85"/>
    </g>`;
  }
  return `<defs>${defs}</defs><g>${blobs}</g>`;
}

function leafAccents(cx, cy, spread, count, seed, fill){
  const rand = (n)=> { const x = Math.sin(n*555)*10000; return x - Math.floor(x); };
  let out = "";
  for (let i=0;i<count;i++){
    const dx = (rand(seed+i)-0.5)*spread;
    const dy = (rand(seed+i+11)-0.5)*spread*0.6 - spread*0.15;
    const rot = rand(seed+i+21)*360;
    out += leafTuft(cx+dx, cy+dy, 0.55 + rand(seed+i+31)*0.35, rot, fill);
  }
  return out;
}

// Small per-prayer twigs: each point sprouts a bare stub on one completed
// prayer, then grows a leaf once the *next* prayer is also done — so
// "1st prayer -> branch, 2nd prayer -> leaf on it" cascades across the day.
function twigCascade(points, count, stroke){
  let out = "";
  points.forEach((p,i)=>{
    if (count <= i) return;
    const tx = p.x + p.dx, ty = p.y + p.dy;
    out += `<path d="M${p.x} ${p.y} L${tx.toFixed(1)} ${ty.toFixed(1)}" stroke="${stroke}" stroke-width="${p.w}" stroke-linecap="round" fill="none"/>`;
    if (count > i+1){
      out += leafTuft(tx, ty, p.leafScale, p.leafRot, p.leafColor);
    }
  });
  return out;
}

function updateGrowthScale(){
  const wrap = document.getElementById("treeWrap");
  const c = todayDoneCount();
  const scale = 1 + c * 0.045;
  wrap.style.transform = `scaleY(${scale.toFixed(3)})`;
}

function bumpGrow(grew){
  const el = document.getElementById("treeImg");
  el.classList.remove("grow-pulse", "shrink-pulse");
  void el.offsetWidth;
  el.classList.add(grew ? "grow-pulse" : "shrink-pulse");
  el.addEventListener("animationend", ()=> el.classList.remove("grow-pulse","shrink-pulse"), { once:true });
}

// Canopy center (cx,cy) and radius in the 240x260 SVG viewBox, per tree stage.
// Growth-leaf decorations are positioned relative to this so they always
// sit around the actual foliage instead of floating in a fixed spot.
const STAGE_CANOPY = [
  { cx: 121, cy: 188, r: 20 },  // seedling
  { cx: 121, cy: 178, r: 34 },  // sapling
  { cx: 120, cy: 116, r: 58 },  // young tree
  { cx: 120, cy: 90,  r: 74 },  // full tree
  { cx: 120, cy: 90,  r: 78 },  // bloom
];
const GROWTH_LEAF_OFFSETS = [
  { dx: -0.4, dy: 0.15, rot: -12 },
  { dx: 0.03, dy: -0.55, rot: 8 },
  { dx: 0.42, dy: 0.05, rot: -6 },
  { dx: -0.2, dy: 0.5,  rot: 14 },
  { dx: 0.4,  dy: 0.4,  rot: -10 },
];
function growthLeafPositions(stageIdx){
  const c = STAGE_CANOPY[stageIdx] ?? STAGE_CANOPY[0];
  return GROWTH_LEAF_OFFSETS.map(o=>({
    left: `${((c.cx + o.dx*c.r) / 240 * 100).toFixed(2)}%`,
    top: `${((c.cy + o.dy*c.r) / 260 * 100).toFixed(2)}%`,
    rot: o.rot,
  }));
}

function renderGrowthLeaves(stageIdx){
  const wrap = document.getElementById("growthLeaves");
  const bushyEnough = (stageIdx ?? 0) >= 2;
  if (!wrap.dataset.built){
    wrap.innerHTML = PRAYERS.map((p)=>{
      return `<div class="growth-leaf" id="gleaf-${p.key}">
        <svg viewBox="0 0 24 24"><path d="M2 20C2 9 9 2 22 2C22 13 15 20 2 20Z" fill="#B7E28C"/></svg>
      </div>`;
    }).join("");
    wrap.dataset.built = "1";
  }
  if (!bushyEnough){
    PRAYERS.forEach(p=>{
      const el = document.getElementById(`gleaf-${p.key}`);
      if (el) el.classList.remove("show");
    });
    return;
  }
  const positions = growthLeafPositions(stageIdx);
  PRAYERS.forEach((p,i)=>{
    const el = document.getElementById(`gleaf-${p.key}`);
    if (!el) return;
    const pos = positions[i];
    el.style.left = pos.left;
    el.style.top = pos.top;
    el.style.setProperty("--rot", `${pos.rot}deg`);
    el.classList.toggle("show", !!todayRecord[p.key]);
  });
}

function renderTree(){
  const prog = overallProgress();
  const showBloom = cycleFinished && prog >= 0.85;
  const stageIdx = showBloom ? 4 : Math.min(3, Math.floor(prog*4));
  const holder = document.getElementById("treeImg");
  const count = todayDoneCount();
  const cacheKey = stageIdx <= 1 ? `${stageIdx}:${count}` : String(stageIdx);
  if (holder.dataset.stage !== cacheKey) {
    holder.innerHTML = TREE_STAGES[stageIdx](count);
    holder.dataset.stage = cacheKey;
  }
  updateGrowthScale();
  document.getElementById("skyStage").classList.toggle("glow", !cycleFinished && count===PRAYERS.length);
  document.getElementById("progressFill").style.width = `${Math.round(prog*100)}%`;
  document.getElementById("progressCount").innerHTML = `${Math.min(dayIndex+1, CYCLE_LEN)} / ${CYCLE_LEN}<span>kun</span>`;
  renderGrowthLeaves(stageIdx);
}

function dropLeaf(){
  const el = document.createElement("div");
  el.className = "leaf-fall";
  const x = -30 + Math.random()*60;
  el.style.left = `calc(50% + ${x}px)`;
  document.getElementById("skyStage").appendChild(el);
  el.addEventListener("animationend", ()=> el.remove());
  bumpGrow(false);
}

// occasional rain bursts from the clouds
function spawnRain(){
  const layer = document.getElementById("rainLayer");
  const count = 3 + Math.floor(Math.random()*4);
  for (let i=0;i<count;i++){
    setTimeout(()=>{
      const d = document.createElement("div");
      d.className = "raindrop";
      d.style.left = (10 + Math.random()*240) + "px";
      d.style.animationDelay = (Math.random()*0.3) + "s";
      layer.appendChild(d);
      d.addEventListener("animationend", ()=> d.remove());
    }, i*140);
  }
  scheduleRain();
}
function scheduleRain(){
  const next = 12000 + Math.random()*14000;
  setTimeout(spawnRain, next);
}
scheduleRain();

const PRAYER_ICON_FILES = {
  bomdod: "bomdod_icon.png",
  peshin: "peshin_icon.png",
  asr: "asr_icon.png",
  shom: "shom_icon.png",
  xufton: "xufton_icon.png",
};

function sparkleBurst(){
  const layer = document.getElementById("sparkleLayer");
  const glyphs = ["🌿","✨","💧"];
  const count = 3 + Math.floor(Math.random()*2);
  for (let i=0;i<count;i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    const x = 50 + (Math.random()*60-30);
    s.style.left = `calc(50% + ${x}px)`;
    s.style.bottom = "70px";
    s.style.animationDelay = (i*0.08) + "s";
    layer.appendChild(s);
    s.addEventListener("animationend", ()=> s.remove());
  }
  bumpGrow(true);
}

function togglePrayer(key){
  const was = !!todayRecord[key];
  todayRecord = {...todayRecord, [key]: !was};
  scores[todayStr] = todayDoneCount()/PRAYERS.length;
  saveRecord(todayStr, todayRecord);
  if (was) dropLeaf(); else sparkleBurst();
  renderList();
  renderTree();
  renderTodayLeaves(was ? null : key);
}

const LEAF_ICON_SVG = `<path d="M4 20C4 12 9 4 20 4C20 14 13 20 4 20Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M4 20C8 16 12 12 18 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`;

function renderTodayLeaves(justToggledKey){
  const wrap = document.getElementById("todayLeaves");
  wrap.innerHTML = PRAYERS.map(p=>{
    const done = !!todayRecord[p.key];
    return `<div class="today-leaf${done?' done':''}" id="leaf-${p.key}" title="${p.label}"><svg viewBox="0 0 24 24">${LEAF_ICON_SVG}</svg></div>`;
  }).join("");
  if (justToggledKey){
    const el = document.getElementById(`leaf-${justToggledKey}`);
    if (el){
      el.classList.add("pop");
      el.addEventListener("animationend", ()=> el.classList.remove("pop"), { once:true });
    }
  }
}

function renderList(){
  const list = document.getElementById("list");
  const reward = document.getElementById("reward");
  if (cycleFinished){ list.style.display="none"; reward.style.display="none"; return; }
  list.style.display = "flex";
  list.innerHTML = PRAYERS.map(p=>{
    const done = !!todayRecord[p.key];
    return `<div class="row" onclick="togglePrayer('${p.key}')">
      <div class="row-icon">
        <img src="${PRAYER_ICON_FILES[p.key]}" alt="${p.label}" />
      </div>
      <div class="row-mid">
        <div class="row-name">${p.label}</div>
        <div class="row-sub">${done ? "Bajarildi" : "Bajarilmadi"}</div>
      </div>
      <div class="check${done?' done':''}">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#10142a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>`;
  }).join("");
  reward.style.display = todayDoneCount()===PRAYERS.length ? "block" : "none";
}

function renderFinish(){
  const finish = document.getElementById("finish");
  if (!cycleFinished){ finish.style.display = "none"; return; }
  finish.style.display = "block";
  const prog = overallProgress();
  document.getElementById("finishTitle").textContent = prog >= 0.85 ? "Tabriklaymiz!" : "Sikl yakunlandi";
  document.getElementById("finishText").textContent = prog >= 0.85
    ? "30 kunlik sikl davomida daraxtingiz to'liq o'sib, mevaga kirdi. Yangi sikl bilan davom eting."
    : "30 kunlik sikl yakunlandi. Daraxt ushbu davrdagi bajarilgan namozlar asosida o'sdi. Yangi sikldan yana boshlashingiz mumkin.";
}

function startNewCycle(){
  setCycleStart(todayStr);
  cycleStart = todayStr;
  cycleStartDate = today;
  dayIndex = 0;
  cycleFinished = false;
  elapsedCount = 0;
  cycleDates = Array.from({length:CYCLE_LEN}, (_,i)=>fmt(addDays(cycleStartDate,i)));
  todayRecord = {...EMPTY_RECORD};
  scores = { [todayStr]: 0 };
  peekDate = null;
  renderAll();
}

function renderAll(){
  renderList();
  renderTree();
  renderTodayLeaves();
  renderFinish();
}

renderAll();
