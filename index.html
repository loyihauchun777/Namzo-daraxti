<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#10142a" />
<title>Kundalik namozlar</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #1c2440 0%, #10142a 55%, #0a0d1c 100%);
    color: #F1EDE3;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 16px 10px;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .topbar { width: 100%; max-width: 380px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; flex-shrink: 0; }
  .topbar svg { width: 20px; height: 20px; color: #C9CEDD; }
  .topbar .topbar-title { font-size: 16px; font-weight: 700; color: #F1EDE3; }
  .header { text-align: center; margin-bottom: 0; flex-shrink: 0; }
  .header .leaf-badge { width: 18px; height: 18px; margin: 0 auto 3px; color: #6FA352; opacity: 0.9; }
  .daycount { font-size: 11.5px; letter-spacing: 0.01em; color: #A8AFC2; margin-bottom: 0; line-height: 1.25; }
  .daycount b { color: #6FA352; font-weight: 700; }
  .title { display: none; }
  .sky-stage { position: relative; width: 100%; max-width: 260px; height: 226px; margin: 0 auto; flex-shrink: 0; }
  .clouds { position: absolute; top: 0; left: 0; width: 100%; height: 60px; pointer-events: none; }
  .cloud { position: absolute; }
  .cloud svg { display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.28)); }
  .cloud.c1 { top: 0px;  left: 4px;   width: 62px; animation: driftA 22s ease-in-out infinite; }
  .cloud.c2 { top: -2px;  left: 84px; width: 50px; animation: driftB 27s ease-in-out infinite; animation-delay: -8s; }
  .cloud.c3 { top: 12px; left: 148px; width: 44px; animation: driftA 18s ease-in-out infinite; animation-delay: -4s; }
  @keyframes driftA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(13px,-4px); } }
  @keyframes driftB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-15px,3px); } }
  .rain-layer { position: absolute; top: 24px; left: 0; width: 100%; height: 100px; pointer-events: none; overflow: visible; }
  .raindrop {
    position: absolute; width: 2px; height: 13px; border-radius: 2px; top: 0;
    background: linear-gradient(to bottom, rgba(185,213,255,0.95), rgba(185,213,255,0));
    animation: rainfall 1.05s linear forwards;
  }
  @keyframes rainfall { 0% { transform: translateY(0); opacity: 0.9; } 100% { transform: translateY(115px); opacity: 0; } }
  .tree-wrap {
    position: relative; width: 172px; max-width: 58vw; margin: 22px auto 0;
    transform-origin: 50% 100%;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .tree-stage { display: block; width: 100%; transform-origin: 50% 100%; }
  .tree-stage.grow-pulse { animation: growPulse 0.4s cubic-bezier(.34,1.56,.64,1); }
  .tree-stage.shrink-pulse { animation: shrinkPulse 0.35s ease; }
  @keyframes growPulse { 0% { transform: scale(1); } 45% { transform: scale(1.09); } 100% { transform: scale(1); } }
  @keyframes shrinkPulse { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
  .tree-stage svg {
    display: block; width: 100%; height: auto; overflow: visible;
    transform-origin: 50% 100%;
    animation: treeSway 6s ease-in-out infinite;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
  }
  @keyframes treeSway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }
  .sky-stage.glow .tree-stage svg { filter: drop-shadow(0 0 14px rgba(242, 200, 121, 0.55)); }
  .growth-leaves { position: absolute; inset: 0; pointer-events: none; }
  .growth-leaf {
    position: absolute; width: 15px; height: 15px; opacity: 0;
    transform: scale(0.2) rotate(var(--rot, 0deg));
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .growth-leaf svg { width: 100%; height: 100%; filter: drop-shadow(0 0 3px rgba(183,226,140,0.7)); }
  .growth-leaf.show { opacity: 1; animation: leafWobble 3.2s ease-in-out infinite; }
  @keyframes leafWobble {
    0%, 100% { transform: scale(1) rotate(calc(var(--rot, 0deg) - 5deg)); }
    50% { transform: scale(1) rotate(calc(var(--rot, 0deg) + 5deg)); }
  }
  .sparkle-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
  .sparkle {
    position: absolute; font-size: 15px; line-height: 1;
    animation: sparkleUp 1s ease-out forwards;
  }
  @keyframes sparkleUp {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-70px) scale(1.1); opacity: 0; }
  }
  .today-leaves {
    display: flex; gap: 8px; justify-content: center; align-items: center;
    margin: 4px 0 0; flex-shrink: 0;
  }
  .today-leaf {
    width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    color: rgba(241,237,227,0.22); transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), color 0.25s ease;
  }
  .today-leaf svg { width: 100%; height: 100%; }
  .today-leaf.done { color: #6FA352; }
  .today-leaf.pop { animation: leafPop 0.45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes leafPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.55) rotate(-8deg); }
    100% { transform: scale(1); }
  }
  .leaf-fall {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 2px 8px 2px 8px;
    background: #7FAE5E;
    top: 80px;
    animation: fall 1.1s ease-in forwards;
    opacity: 0.9;
    pointer-events: none;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(110px) rotate(220deg); opacity: 0; }
  }
  .progress-pill {
    width: 100%; max-width: 360px; display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.045); border: 1px solid rgba(241,237,227,0.08);
    border-radius: 999px; padding: 7px 14px; margin: 6px 0; flex-shrink: 0;
  }
  .progress-pill svg { width: 17px; height: 17px; flex-shrink: 0; color: #6FA352; }
  .progress-track { flex: 1; height: 7px; border-radius: 999px; background: rgba(241,237,227,0.12); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#6FA352,#8FB86A); border-radius: 999px; transition: width 0.3s ease; }
  .progress-count { font-size: 12px; font-weight: 700; color: #F1EDE3; white-space: nowrap; text-align: right; line-height: 1.2; }
  .progress-count span { display: block; font-size: 9.5px; font-weight: 500; color: #8B93AB; }
  .location-pill {
    width: 100%; max-width: 360px; display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.045); border: 1px solid rgba(241,237,227,0.08);
    border-radius: 999px; padding: 6px 12px; margin: 0 0 6px; flex-shrink: 0;
    position: relative;
  }
  .location-pill svg { width: 15px; height: 15px; flex-shrink: 0; color: #E3A857; }
  .location-pill select {
    flex: 1; appearance: none; -webkit-appearance: none; background: transparent;
    border: none; outline: none; color: #F1EDE3; font-size: 12px; font-weight: 600;
    font-family: inherit; padding-right: 14px;
  }
  .location-pill select option { background: #1c2440; color: #F1EDE3; }
  .location-pill .chev { position: absolute; right: 12px; width: 11px; height: 11px; color: #8B93AB; pointer-events: none; }
  .day-track-wrap { position: relative; width: 100%; max-width: 360px; margin: 6px 0; flex-shrink: 0; }
  .day-track { display: flex; gap: 8px; overflow-x: auto; padding: 4px 6px; scrollbar-width: none; }
  .day-track::-webkit-scrollbar { display: none; }
  .day-chip {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; color: #10142a;
    background: rgba(241,237,227,0.12); color: #C9CEDD;
    border: 2px solid transparent; cursor: pointer;
  }
  .day-chip.done { background: #6FA352; color: #10142a; }
  .day-chip.future { background: #C8933F; color: #2a1c08; }
  .day-chip.missed { background: rgba(241,237,227,0.06); color: #6b7186; }
  .day-chip.today { border-color: #F1EDE3; }
  .day-peek {
    position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    background: #F1EDE3; color: #10142a; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    display: none; pointer-events: none;
  }
  .day-peek.show { display: block; }
  .list { width: 100%; max-width: 360px; background: rgba(255,255,255,0.03); border: 1px solid rgba(241,237,227,0.07); border-radius: 16px; padding: 0 14px; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid rgba(241,237,227,0.07);
    cursor: pointer; user-select: none; gap: 10px;
  }
  .row:last-child { border-bottom: none; }
  .row-icon {
    width: 34px; height: 38px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .row-icon img { width: 100%; height: 100%; object-fit: contain; }
  .row-mid { flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .row-name { font-size: 14.5px; font-weight: 600; }
  .row-sub { font-size: 11px; color: #8B93AB; }
  .check {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    border: 1.5px solid rgba(241,237,227,0.28);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s ease;
  }
  .check.done { background: #6FA352; border-color: #6FA352; }
  .check svg { width: 14px; height: 14px; display: none; }
  .check.done svg { display: block; }
  .reward {
    margin-top: 6px; padding: 8px 16px; border-radius: 999px; flex-shrink: 0;
    background: rgba(242,200,121,0.12); border: 1px solid rgba(242,200,121,0.35);
    color: #F2C879; font-size: 11.5px; font-weight: 600; text-align: center;
  }
  .finish { margin-top: 10px; text-align: center; max-width: 320px; display: none; flex-shrink: 0; }
  .finish h3 { font-size: 17px; margin-bottom: 5px; color: #F2C879; }
  .finish p { font-size: 12px; color: #C9CEDD; line-height: 1.4; margin-bottom: 10px; }
  .btn {
    background: #E3A857; color: #10142a; border: none; border-radius: 999px;
    padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .bottom-nav {
    width: 100%; max-width: 360px; flex-shrink: 0; margin-top: 6px;
    background: rgba(20,24,45,0.92);
    border: 1px solid rgba(241,237,227,0.09); border-radius: 999px;
    display: flex; align-items: center; justify-content: space-around;
    padding: 9px 0; box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .bottom-nav .nav-item { display: flex; align-items: center; justify-content: center; padding: 3px 18px; color: #8B93AB; cursor: pointer; }
  .bottom-nav .nav-item svg { width: 20px; height: 20px; }
  .bottom-nav .nav-item.active { color: #6FA352; }

  .page { display: flex; flex-direction: column; align-items: center; width: 100%; flex: 1; min-height: 0; }
  .page-scroll { width: 100%; max-width: 380px; flex: 1; min-height: 0; overflow-y: auto; margin: 6px auto 0; -webkit-overflow-scrolling: touch; }
  .page-title { text-align: center; margin-bottom: 8px; flex-shrink: 0; }
  .page-title .t { font-size: 16px; font-weight: 700; color: #F1EDE3; }
  .page-title .s { font-size: 11.5px; color: #A8AFC2; margin-top: 2px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 2px 10px; }
  .stat-card {
    background: rgba(255,255,255,0.045); border: 1px solid rgba(241,237,227,0.08);
    border-radius: 14px; padding: 12px 10px; text-align: center;
  }
  .stat-card .v { font-size: 20px; font-weight: 700; color: #6FA352; line-height: 1.2; }
  .stat-card .l { font-size: 10.5px; color: #8B93AB; margin-top: 2px; }
  .day-list { background: rgba(255,255,255,0.03); border: 1px solid rgba(241,237,227,0.07); border-radius: 16px; padding: 0 14px; margin: 0 2px; }
  .day-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(241,237,227,0.07); }
  .day-row:last-child { border-bottom: none; }
  .day-row .d { font-size: 12.5px; color: #C9CEDD; width: 68px; flex-shrink: 0; }
  .day-row .d.is-today { color: #F1EDE3; font-weight: 700; }
  .day-row .bar-track { flex: 1; height: 7px; border-radius: 999px; background: rgba(241,237,227,0.12); overflow: hidden; }
  .day-row .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg,#6FA352,#8FB86A); }
  .day-row .n { font-size: 11.5px; color: #8B93AB; width: 30px; text-align: right; flex-shrink: 0; }
  .empty-note { text-align: center; font-size: 12px; color: #8B93AB; padding: 20px 10px; }
</style>
</head>
<body>

  <div class="topbar">
    <svg viewBox="0 0 24 24" fill="none" onclick="history.back()"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="topbar-title">Namoz daraxti</div>
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
  </div>

  <div class="page" id="pageTree">
  <div class="header">
    <svg class="leaf-badge" viewBox="0 0 24 24" fill="none"><path d="M4 20C4 12 9 4 20 4C20 14 13 20 4 20Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 20C8 16 12 12 18 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <div class="daycount">Har bir namoz &ndash;<br/><b>daraxtingizning yangi shoxchasi</b></div>
  </div>

  <div class="sky-stage" id="skyStage">
    <div class="clouds">
      <div class="cloud c1">
        <svg viewBox="0 0 100 46" width="100" height="46">
          <defs><linearGradient id="cg1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#dee3ef"/><stop offset="100%" stop-color="#c7cfe2"/>
          </linearGradient></defs>
          <ellipse cx="30" cy="26" rx="26" ry="15" fill="url(#cg1)"/>
          <ellipse cx="56" cy="19" rx="19" ry="13" fill="url(#cg1)"/>
          <ellipse cx="73" cy="27" rx="15" ry="11" fill="url(#cg1)"/>
          <ellipse cx="16" cy="30" rx="13" ry="9" fill="url(#cg1)"/>
        </svg>
      </div>
      <div class="cloud c2">
        <svg viewBox="0 0 90 42" width="90" height="42">
          <defs><linearGradient id="cg2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#dee3ef"/><stop offset="100%" stop-color="#c7cfe2"/>
          </linearGradient></defs>
          <ellipse cx="26" cy="24" rx="22" ry="13" fill="url(#cg2)"/>
          <ellipse cx="50" cy="17" rx="16" ry="11" fill="url(#cg2)"/>
          <ellipse cx="65" cy="25" rx="12" ry="9" fill="url(#cg2)"/>
        </svg>
      </div>
      <div class="cloud c3">
        <svg viewBox="0 0 80 38" width="80" height="38">
          <defs><linearGradient id="cg3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#dee3ef"/><stop offset="100%" stop-color="#c7cfe2"/>
          </linearGradient></defs>
          <ellipse cx="22" cy="21" rx="19" ry="11" fill="url(#cg3)"/>
          <ellipse cx="43" cy="15" rx="14" ry="9" fill="url(#cg3)"/>
          <ellipse cx="58" cy="22" rx="11" ry="8" fill="url(#cg3)"/>
        </svg>
      </div>
    </div>
    <div class="rain-layer" id="rainLayer"></div>
    <div class="sparkle-layer" id="sparkleLayer"></div>
    <div class="tree-wrap" id="treeWrap">
      <div id="treeImg" class="tree-stage"></div>
      <div class="growth-leaves" id="growthLeaves"></div>
    </div>
  </div>

  <div class="today-leaves" id="todayLeaves"></div>

  <div class="location-pill" id="locationPill">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 19 14.5 19 9.5C19 5.4 15.6 2 12 2C8.4 2 5 5.4 5 9.5C5 14.5 12 21 12 21Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.7"/></svg>
    <select id="citySelect" onchange="onCityChange(this.value)"></select>
    <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="day-track-wrap">
    <div class="day-peek" id="dayPeek"></div>
    <div class="day-track" id="dayTrack"></div>
  </div>

  <div class="list" id="list"></div>

  <div class="reward" id="reward" style="display:none;">Bugungi mukofot: barcha 5 vaqt namoz to'liq bajarildi</div>

  <div class="finish" id="finish">
    <h3 id="finishTitle">Sikl yakunlandi</h3>
    <p id="finishText"></p>
    <button class="btn" onclick="startNewCycle()">Yangi sikl boshlash</button>
  </div>
  </div>

  <div class="page" id="pageHome" style="display:none;">
    <div class="page-title">
      <div class="t">Umumiy holat</div>
      <div class="s" id="homeSubtitle"></div>
    </div>
    <div class="page-scroll">
      <div class="stat-grid" id="homeStats"></div>
      <button class="btn" id="resetBtn" style="display:block; margin:8px auto 0; background:rgba(226,90,90,0.16); color:#E77; border:1px solid rgba(226,90,90,0.4);" onclick="resetStats()">Statistikani 0 dan boshlash</button>
    </div>
  </div>

  <div class="page" id="pageStats" style="display:none;">
    <div class="page-title">
      <div class="t">Statistika</div>
      <div class="s">Sikl davomidagi kunlar bo'yicha natija</div>
    </div>
    <div class="page-scroll">
      <div class="day-list" id="dayList"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" id="navHome" onclick="switchPage('home')"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11M6 10V20H18V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="nav-item active" id="navTree" onclick="switchPage('tree')"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20C4 12 9 4 20 4C20 14 13 20 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 20C8 16 12 12 18 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
    <div class="nav-item" id="navStats" onclick="switchPage('stats')"><svg viewBox="0 0 24 24" fill="none"><path d="M5 19V11M12 19V5M19 19V14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></div>
  </div>

<!-- Namoz vaqtlarini offline (API'siz) hisoblaydigan kutubxona: lat/lng + sanadan astronomik hisoblash -->
<script src="https://cdn.jsdelivr.net/npm/adhan@4.4.3/lib/adhan.min.js"></script>
<script>
const PRAYERS = [
  { key: "bomdod", label: "Bomdod" },
  { key: "peshin", label: "Peshin" },
  { key: "asr", label: "Asr" },
  { key: "shom", label: "Shom" },
  { key: "xufton", label: "Xufton" },
];
const CYCLE_LEN = 30;
const EMPTY_RECORD = { bomdod:false, peshin:false, asr:false, shom:false, xufton:false };

// ---- Namoz vaqtlari (API'siz, offline astronomik hisoblash - adhan.js) ----
// Standart: GPS orqali joriy joylashuv. Ruxsat berilmasa yoki foydalanuvchi
// qo'lda tanlasa, quyidagi shaharlar ro'yxatidan koordinata olinadi.
const CITIES = [
  { id: "auto",      name: "Joriy joylashuv (GPS)", lat: null,     lng: null },
  { id: "tashkent",  name: "Toshkent",   lat: 41.2995, lng: 69.2401 },
  { id: "samarkand", name: "Samarqand",  lat: 39.6542, lng: 66.9597 },
  { id: "bukhara",   name: "Buxoro",     lat: 39.7747, lng: 64.4286 },
  { id: "andijan",   name: "Andijon",    lat: 40.7821, lng: 72.3442 },
  { id: "namangan",  name: "Namangan",   lat: 41.0011, lng: 71.6725 },

const DEFAULT_LOC = { lat: 41.2995, lng: 69.2401 };
const PRAYER_TIME_KEY = { bomdod: "fajr", peshin: "dhuhr", asr: "asr", shom: "maghrib", xufton: "isha" };
let selectedCityId = localStorage.getItem("meta:city-id") || "auto";
let userLoc = (()=>{
  try { const raw = localStorage.getItem("meta:loc"); return raw ? JSON.parse(raw) : DEFAULT_LOC; }
  catch(e){ return DEFAULT_LOC; }
})();
let prayerTimesToday = null;

function computePrayerTimes(){
  if (typeof adhan === "undefined") return null;
  try {
    const coords = new adhan.Coordinates(userLoc.lat, userLoc.lng);
    const params = adhan.CalculationMethod.MuslimWorldLeague();
    params.madhab = adhan.Madhab.Hanafi; // O'zbekistonda Hanafiy mazhab - Asr vaqti shunga mos hisoblanadi
    return new adhan.PrayerTimes(coords, new Date(), params);
  } catch(e){ return null; }
}

function formatPrayerTime(d){
  if (!d) return "";
  return d.toLocaleTimeString("uz-UZ", { hour: "2-digit", minute: "2-digit", hour12: false });
}

function prayerTimeLabel(key){
  if (!prayerTimesToday) return "";
  return formatPrayerTime(prayerTimesToday[PRAYER_TIME_KEY[key]]);
}

function refreshPrayerTimes(){
  prayerTimesToday = computePrayerTimes();
  renderList();
}

function populateCitySelect(){
  const sel = document.getElementById("citySelect");
  sel.innerHTML = CITIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
  sel.value = selectedCityId;
}

function useGeolocation(){
  if (!navigator.geolocation){ userLoc = DEFAULT_LOC; refreshPrayerTimes(); return; }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      try { localStorage.setItem("meta:loc", JSON.stringify(userLoc)); } catch(e){}
      refreshPrayerTimes();
    },
    ()=>{ /* ruxsat berilmadi - oldingi/standart joylashuv bilan davom etiladi */ refreshPrayerTimes(); },
    { timeout: 8000 }
  );
}

function onCityChange(cityId){
  selectedCityId = cityId;
  try { localStorage.setItem("meta:city-id", cityId); } catch(e){}
  const city = CITIES.find(c=>c.id===cityId);
  if (cityId === "auto"){
    useGeolocation();
  } else {
    userLoc = { lat: city.lat, lng: city.lng };
    try { localStorage.setItem("meta:loc", JSON.stringify(userLoc)); } catch(e){}
    refreshPrayerTimes();
  }
}

function initPrayerTimes(){
  populateCitySelect();
  refreshPrayerTimes(); // saqlangan/standart koordinata bilan darhol ko'rsatish
  if (selectedCityId === "auto") useGeolocation();
}

function fmt(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function daysBetween(a,b){ const MS=86400000; const da=new Date(a.getFullYear(),a.getMonth(),a.getDate()); const db=new Date(b.getFullYear(),b.getMonth(),b.getDate()); return Math.round((db-da)/MS); }
function displayDate(s){ const [y,m,d]=s.split("-"); return `${d}.${m}.${y}`; }

function loadRecord(dateStr){
  try { const raw = localStorage.getItem("day:"+dateStr); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveRecord(dateStr, rec){
  try { localStorage.setItem("day:"+dateStr, JSON.stringify(rec)); } catch(e){}
}
function getCycleStart(todayStr){
  let s = localStorage.getItem("meta:cycle-start");
  if (!s) { s = todayStr; localStorage.setItem("meta:cycle-start", s); }
  return s;
}
function setCycleStart(s){ localStorage.setItem("meta:cycle-start", s); }

let today = new Date();
let todayStr = fmt(today);
let cycleStart = getCycleStart(todayStr);
let cycleStartDate = (()=>{ const [y,m,d]=cycleStart.split("-").map(Number); return new Date(y,m-1,d); })();
let dayIndex = daysBetween(cycleStartDate, today);
let cycleFinished = dayIndex >= CYCLE_LEN;
let elapsedCount = Math.min(dayIndex, CYCLE_LEN-1);
let cycleDates = Array.from({length:CYCLE_LEN}, (_,i)=>fmt(addDays(cycleStartDate,i)));
let todayRecord = loadRecord(todayStr) || {...EMPTY_RECORD};
let scores = {};
cycleDates.slice(0, elapsedCount+1).forEach(d=>{
  const rec = d===todayStr ? todayRecord : loadRecord(d);
  const done = rec ? PRAYERS.filter(p=>rec[p.key]).length : 0;
  scores[d] = done / PRAYERS.length;
});
let peekDate = null;

function overallProgress(){
  let sum = 0;
  cycleDates.forEach((d,i)=>{
    if (i > elapsedCount && d !== todayStr) return;
    sum += scores[d] ?? 0;
  });
  return sum / CYCLE_LEN;
}

function todayDoneCount(){ return PRAYERS.filter(p=>todayRecord[p.key]).length; }

const LEAF_TUFT = `<path d="M0 8C0 3.5 3.5 0 9 0C9 4.5 5.5 8 0 8Z" />`;

function leafTuft(x, y, scale, rot, fill){
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${scale})">
    <g fill="${fill}">${LEAF_TUFT}</g>
    <path d="M0.5 7C1.5 4.5 3.5 2 8 0.6" stroke="#000000" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.18"/>
    <g fill="#ffffff" opacity="0.32" style="mix-blend-mode:soft-light" transform="translate(1.2,1) scale(0.6)">${LEAF_TUFT}</g>
  </g>`;
}

// A couple of faint parallel bark-groove strokes drawn alongside a trunk path,
// to break up the flat gradient fill with subtle cylindrical shading.
function barkTexture(d, offset){

function pebble(x, y, r, rot, tone){

function flower(x, y, scale, petal){
  const c = petal || '#F6F1E4';

    const ang = i*72;
    petals += `<ellipse cx="0" cy="-2.6" rx="1.5" ry="2.3" fill="${c}" transform="rotate(${ang})"/>`;

    <g>${petals}</g>

}

// Small clustered berry/fruit dots scattered across a canopy, echoing the
// tiny fruit specks seen on a mature tree's foliage.
function canopyBerries(cx, cy, spread, count, seed){
  const rand = (n)=> { const x = Math.sin(n*321.7)*10000; return x - Math.floor(x); };
  let out = "";
  for (let i=0;i<count;i++){
    const dx = (rand(seed+i)-0.5)*spread;
    const dy = (rand(seed+i+13)-0.5)*spread*0.7;
    out += `<circle cx="${(cx+dx).toFixed(1)}" cy="${(cy+dy).toFixed(1)}" r="1.6" fill="#E8834A"/>`;
  }
  return out;
}

function hexBlend(hex1, hex2, t){
  const c1 = parseInt(hex1.slice(1),16), c2 = parseInt(hex2.slice(1),16);
  const r1=(c1>>16)&255, g1=(c1>>8)&255, b1=c1&255;
  const r2=(c2>>16)&255, g2=(c2>>8)&255, b2=c2&255;
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return `#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}`;
}

// A single soft, rounded canopy silhouette (like an actual treetop) with
// gentle sphere-like shading, a mottled texture clipped inside it for leaf
// variation, and a fringe of small individual leaves around the rim so the
// outline reads as foliage rather than a smooth geometric blob.
function canopyCluster(id, cx, cy, spread, count, fillA, fillB){
  const light = hexBlend(fillA, '#ffffff', 0.3);
  const dark = fillB;
  const rx = spread*0.52, ry = rx*0.8;
  const rand = (seed)=> { const x = Math.sin(seed*999)*10000; return x - Math.floor(x); };
  const gradId = `${id}main`, clipId = `${id}clip`, blurId = `${id}blur`;

  let texture = "";
  const texCount = Math.round(count*2.2);
  for (let i=0;i<texCount;i++){
    const ang = rand(i*3+1)*Math.PI*2;
    const rad = Math.sqrt(rand(i*3+2))*0.85;
    const bx = cx + Math.cos(ang)*rx*rad;
    const by = cy + Math.sin(ang)*ry*rad;
    const r = rx*0.16*(0.6+rand(i*3+3)*0.6);
    const tone = rand(i*3+4) > 0.5 ? light : dark;
    texture += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${r.toFixed(1)}" fill="${tone}" opacity="0.26"/>`;
  }

  let fringe = "";
  const fringeCount = Math.round(count*1.6);
  for (let i=0;i<fringeCount;i++){
    const ang = -Math.PI*0.92 + (i/(fringeCount-1 || 1)) * Math.PI*1.84;
    const bx = cx + Math.cos(ang)*rx*0.98;
    const by = cy + Math.sin(ang)*ry*0.98;
    const rot = (ang*180/Math.PI) + 90 + (rand(i+50)-0.5)*30;
    const scale = 0.55 + rand(i+60)*0.35;
    const tone = rand(i+70) > 0.5 ? fillA : dark;
    fringe += leafTuft(bx, by, scale, rot, tone);
  }

  return `<defs>
    <radialGradient id="${gradId}" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="${light}"/>
      <stop offset="55%" stop-color="${fillA}"/>
      <stop offset="100%" stop-color="${dark}"/>
    </radialGradient>
    <clipPath id="${clipId}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath>
    <filter id="${blurId}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <ellipse cx="${cx+3}" cy="${cy+9}" rx="${(rx*0.96).toFixed(1)}" ry="${(ry*0.9).toFixed(1)}" fill="${dark}" opacity="0.35" filter="url(#${blurId})"/>
  <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${gradId})"/>
  <g clip-path="url(#${clipId})">${texture}</g>
  <g>${fringe}</g>`;
}

function leafAccents(cx, cy, spread, count, seed, fill){
  const rand = (n)=> { const x = Math.sin(n*555)*10000; return x - Math.floor(x); };
  let out = "";
  for (let i=0;i<count;i++){
    const dx = (rand(seed+i)-0.5)*spread;
    const dy = (rand(seed+i+11)-0.5)*spread*0.6 - spread*0.15;
    const rot = rand(seed+i+21)*360;
    out += leafTuft(cx+dx, cy+dy, 0.55 + rand(seed+i+31)*0.35, rot, fill);
  }
  return out;
}

// Small per-prayer twigs: each point sprouts a bare stub on one completed
// prayer, then grows a leaf once the *next* prayer is also done — so
// "1st prayer -> branch, 2nd prayer -> leaf on it" cascades across the day.
function twigCascade(points, count, stroke){
  let out = "";
  points.forEach((p,i)=>{
    if (count <= i) return;
    const tx = p.x + p.dx, ty = p.y + p.dy;
    out += `<path d="M${p.x} ${p.y} L${tx.toFixed(1)} ${ty.toFixed(1)}" stroke="${stroke}" stroke-width="${p.w}" stroke-linecap="round" fill="none"/>`;
    if (count > i+1){
      out += leafTuft(tx, ty, p.leafScale, p.leafRot, p.leafColor);
    }
  });
  return out;
}

    <path d="M118 166C98 154 82 148 66 144" stroke="url(#trunk5)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M122 156C142 143 158 136 176 132" stroke="url(#trunk5)" stroke-width="6" stroke-linecap="round" fill="none"/>
    ${canopyCluster('canopyG5',120,98,150,9,'#A9D988','#3E5C2C')}
    ${leafAccents(120,90,160,15,9,'#C4EDA0')}
    <circle cx="88" cy="92" r="5.5" fill="#F2C879"/>
    <circle cx="150" cy="80" r="5.5" fill="#F2C879"/>
    <circle cx="120" cy="114" r="5.5" fill="#F2C879"/>
    <circle cx="164" cy="110" r="5" fill="#F2C879"/>
    <circle cx="98" cy="122" r="5" fill="#F2C879"/>
    <circle cx="140" cy="126" r="4.5" fill="#F2C879"/>
    ${bunny(76,250,1.05,'right')}
    ${bunny(158,253,0.95,'left')}
    ${flower(182,254,1)}
    ${flower(58,253,0.85)}
  </svg>`,
];

// Cumulative prayers completed so far this cycle (all elapsed days + today),
// not just today's count -- so the tree's extra "puffiness" accumulates over
// the cycle instead of collapsing back to baseline every time a new day starts.
function cumulativeDoneCount(){
  let sum = 0;
  cycleDates.forEach((d,i)=>{
    if (i > elapsedCount && d !== todayStr) return;
    sum += (scores[d] ?? 0) * PRAYERS.length;
  });
  return sum;
}

function updateGrowthScale(){
  const wrap = document.getElementById("treeWrap");
  const days = elapsedCount + 1;
  const avgFraction = cumulativeDoneCount() / (PRAYERS.length * days); // 0..1 average consistency so far
  const scale = 1 + avgFraction * 0.14; // gentle puff-up, capped low enough to stay clear of the clouds
  wrap.style.transform = `scaleY(${scale.toFixed(3)})`;
}

function bumpGrow(grew){
  const el = document.getElementById("treeImg");
  el.classList.remove("grow-pulse", "shrink-pulse");
  void el.offsetWidth;
  el.classList.add(grew ? "grow-pulse" : "shrink-pulse");
  el.addEventListener("animationend", ()=> el.classList.remove("grow-pulse","shrink-pulse"), { once:true });
}

// Canopy center (cx,cy) and radius in the 240x260 SVG viewBox, per tree stage.
// Growth-leaf decorations are positioned relative to this so they always
// sit around the actual foliage instead of floating in a fixed spot.
const STAGE_CANOPY = [
  { cx: 121, cy: 188, r: 20 },  // seedling
  { cx: 121, cy: 178, r: 34 },  // sapling
  { cx: 120, cy: 116, r: 58 },  // young tree
  { cx: 120, cy: 90,  r: 74 },  // full tree
  { cx: 120, cy: 90,  r: 78 },  // bloom
];
const GROWTH_LEAF_OFFSETS = [
  { dx: -0.4, dy: 0.15, rot: -12 },
  { dx: 0.03, dy: -0.55, rot: 8 },
  { dx: 0.42, dy: 0.05, rot: -6 },
  { dx: -0.2, dy: 0.5,  rot: 14 },
  { dx: 0.4,  dy: 0.4,  rot: -10 },
];
function growthLeafPositions(stageIdx){
  const c = STAGE_CANOPY[stageIdx] ?? STAGE_CANOPY[0];
  return GROWTH_LEAF_OFFSETS.map(o=>({
    left: `${((c.cx + o.dx*c.r) / 240 * 100).toFixed(2)}%`,
    top: `${((c.cy + o.dy*c.r) / 260 * 100).toFixed(2)}%`,
    rot: o.rot,
  }));
}

function renderGrowthLeaves(stageIdx){
  const wrap = document.getElementById("growthLeaves");
  const bushyEnough = (stageIdx ?? 0) >= 2;
  if (!wrap.dataset.built){
    wrap.innerHTML = PRAYERS.map((p)=>{
      return `<div class="growth-leaf" id="gleaf-${p.key}">
        <svg viewBox="0 0 24 24"><path d="M2 20C2 9 9 2 22 2C22 13 15 20 2 20Z" fill="#B7E28C"/></svg>
      </div>`;
    }).join("");
    wrap.dataset.built = "1";
  }
  if (!bushyEnough){
    PRAYERS.forEach(p=>{
      const el = document.getElementById(`gleaf-${p.key}`);
      if (el) el.classList.remove("show");
    });
    return;
  }
  const positions = growthLeafPositions(stageIdx);
  PRAYERS.forEach((p,i)=>{
    const el = document.getElementById(`gleaf-${p.key}`);
    if (!el) return;
    const pos = positions[i];
    el.style.left = pos.left;
    el.style.top = pos.top;
    el.style.setProperty("--rot", `${pos.rot}deg`);
    el.classList.toggle("show", !!todayRecord[p.key]);
  });
}

function renderDayTrack(){
  const wrap = document.getElementById("dayTrack");
  if (!wrap.dataset.built){
    wrap.innerHTML = cycleDates.map((d,i)=>`<div class="day-chip" id="daychip-${d}" onclick="peekDay('${d}')">${i+1}</div>`).join("");
    wrap.dataset.built = "1";
  }
  cycleDates.forEach((d,i)=>{
    const el = document.getElementById(`daychip-${d}`);
    if (!el) return;
    const isToday = d === todayStr;
    const isFuture = i > elapsedCount && d !== todayStr;
    const score = scores[d] ?? 0;
    let cls = "day-chip";
    if (isFuture) cls += " future";
    else if (score >= 1) cls += " done";
    else if (!isToday) cls += " missed";
    if (isToday) cls += " today";
    el.className = cls;
  });
  if (!wrap.dataset.scrolled){
    const todayEl = document.getElementById(`daychip-${todayStr}`);
    if (todayEl){ todayEl.scrollIntoView({inline:"center", block:"nearest"}); wrap.dataset.scrolled = "1"; }
  }
}

let peekTimer = null;
function peekDay(dateStr){
  const peek = document.getElementById("dayPeek");
  const rec = dateStr === todayStr ? todayRecord : loadRecord(dateStr);
  const n = rec ? PRAYERS.filter(p=>rec[p.key]).length : 0;
  peek.textContent = `${displayDate(dateStr)}: ${n}/${PRAYERS.length}`;
  peek.classList.add("show");
  peekDate = dateStr;
  clearTimeout(peekTimer);
  peekTimer = setTimeout(()=>{ peek.classList.remove("show"); peekDate = null; }, 2000);
}

function renderTree(){
  const prog = overallProgress();
  const showBloom = cycleFinished && prog >= 0.85;
  const stageIdx = showBloom ? 4 : Math.min(3, Math.floor(prog*4));
  const holder = document.getElementById("treeImg");
  const count = todayDoneCount();
  const cacheKey = stageIdx <= 1 ? `${stageIdx}:${count}` : String(stageIdx);
  if (holder.dataset.stage !== cacheKey) {
    holder.innerHTML = TREE_STAGES[stageIdx](count);
    holder.dataset.stage = cacheKey;
  }
  updateGrowthScale();
  document.getElementById("skyStage").classList.toggle("glow", !cycleFinished && count===PRAYERS.length);
  renderDayTrack();
  renderGrowthLeaves(stageIdx);
}

function dropLeaf(){
  const el = document.createElement("div");
  el.className = "leaf-fall";
  const x = -30 + Math.random()*60;
  el.style.left = `calc(50% + ${x}px)`;
  document.getElementById("skyStage").appendChild(el);
  el.addEventListener("animationend", ()=> el.remove());
  bumpGrow(false);
}

// occasional rain bursts from the clouds
function spawnRain(){
  const layer = document.getElementById("rainLayer");
  const count = 3 + Math.floor(Math.random()*4);
  for (let i=0;i<count;i++){
    setTimeout(()=>{
      const d = document.createElement("div");
      d.className = "raindrop";
      d.style.left = (10 + Math.random()*240) + "px";
      d.style.animationDelay = (Math.random()*0.3) + "s";
      layer.appendChild(d);
      d.addEventListener("animationend", ()=> d.remove());
    }, i*140);
  }
  scheduleRain();
}
function scheduleRain(){
  const next = 12000 + Math.random()*14000;
  setTimeout(spawnRain, next);
}
scheduleRain();

const PRAYER_ICON_FILES = {
  bomdod: "bomdod_icon.png",
  peshin: "peshin_icon.png",
  asr: "asr_icon.png",
  shom: "shom_icon.png",
  xufton: "xufton_icon.png",
};

function sparkleBurst(){
  const layer = document.getElementById("sparkleLayer");
  const glyphs = ["🌿","✨","💧"];
  const count = 3 + Math.floor(Math.random()*2);
  for (let i=0;i<count;i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    const x = 50 + (Math.random()*60-30);
    s.style.left = `calc(50% + ${x}px)`;
    s.style.bottom = "70px";
    s.style.animationDelay = (i*0.08) + "s";
    layer.appendChild(s);
    s.addEventListener("animationend", ()=> s.remove());
  }
  bumpGrow(true);
}

function togglePrayer(key){
  const was = !!todayRecord[key];
  todayRecord = {...todayRecord, [key]: !was};
  scores[todayStr] = todayDoneCount()/PRAYERS.length;
  saveRecord(todayStr, todayRecord);
  if (was) dropLeaf(); else sparkleBurst();
  renderList();
  renderTree();
  renderTodayLeaves(was ? null : key);
}

const LEAF_ICON_SVG = `<path d="M4 20C4 12 9 4 20 4C20 14 13 20 4 20Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M4 20C8 16 12 12 18 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`;

function renderTodayLeaves(justToggledKey){
  const wrap = document.getElementById("todayLeaves");
  wrap.innerHTML = PRAYERS.map(p=>{
    const done = !!todayRecord[p.key];
    return `<div class="today-leaf${done?' done':''}" id="leaf-${p.key}" title="${p.label}"><svg viewBox="0 0 24 24">${LEAF_ICON_SVG}</svg></div>`;
  }).join("");
  if (justToggledKey){
    const el = document.getElementById(`leaf-${justToggledKey}`);
    if (el){
      el.classList.add("pop");
      el.addEventListener("animationend", ()=> el.classList.remove("pop"), { once:true });
    }
  }
}

function renderList(){
  const list = document.getElementById("list");
  const reward = document.getElementById("reward");
  if (cycleFinished){ list.style.display="none"; reward.style.display="none"; return; }
  list.style.display = "flex";
  list.innerHTML = PRAYERS.map(p=>{
    const done = !!todayRecord[p.key];
    return `<div class="row" onclick="togglePrayer('${p.key}')">
      <div class="row-icon">
        <img src="${PRAYER_ICON_FILES[p.key]}" alt="${p.label}" />
      </div>
      <div class="row-mid">
        <div class="row-name">${p.label}</div>
        <div class="row-sub">${prayerTimeLabel(p.key) ? prayerTimeLabel(p.key) + " &middot; " : ""}${done ? "Bajarildi" : "Bajarilmadi"}</div>
      </div>
      <div class="check${done?' done':''}">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#10142a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>`;
  }).join("");
  reward.style.display = todayDoneCount()===PRAYERS.length ? "block" : "none";
}

function renderFinish(){
  const finish = document.getElementById("finish");
  if (!cycleFinished){ finish.style.display = "none"; return; }
  finish.style.display = "block";
  const prog = overallProgress();
  document.getElementById("finishTitle").textContent = prog >= 0.85 ? "Tabriklaymiz!" : "Sikl yakunlandi";
  document.getElementById("finishText").textContent = prog >= 0.85
    ? "30 kunlik sikl davomida daraxtingiz to'liq o'sib, mevaga kirdi. Yangi sikl bilan davom eting."
    : "30 kunlik sikl yakunlandi. Daraxt ushbu davrdagi bajarilgan namozlar asosida o'sdi. Yangi sikldan yana boshlashingiz mumkin.";
}

function resetStats(){
  const ok = confirm("Haqiqatan ham statistikani 0 dan boshlaysizmi? Barcha tarix o'chiriladi va bu amalni ortga qaytarib bo'lmaydi.");
  if (!ok) return;
  Object.keys(localStorage).forEach(k=>{ if (k.startsWith("day:")) localStorage.removeItem(k); });
  startNewCycle();
  switchPage("tree");
}

function startNewCycle(){
  setCycleStart(todayStr);
  cycleStart = todayStr;
  cycleStartDate = today;
  dayIndex = 0;
  cycleFinished = false;
  elapsedCount = 0;
  cycleDates = Array.from({length:CYCLE_LEN}, (_,i)=>fmt(addDays(cycleStartDate,i)));
  todayRecord = {...EMPTY_RECORD};
  scores = { [todayStr]: 0 };
  peekDate = null;
  const dt = document.getElementById("dayTrack");
  if (dt) { delete dt.dataset.built; delete dt.dataset.scrolled; }
  document.getElementById("dayPeek").classList.remove("show");
  renderAll();
}

function switchPage(name){
  const pages = { tree: "pageTree", home: "pageHome", stats: "pageStats" };
  Object.entries(pages).forEach(([key, id])=>{
    document.getElementById(id).style.display = key === name ? "flex" : "none";
  });
  document.getElementById("navTree").classList.toggle("active", name === "tree");
  document.getElementById("navHome").classList.toggle("active", name === "home");
  document.getElementById("navStats").classList.toggle("active", name === "stats");
  if (name === "home") renderHome();
  if (name === "stats") renderStats();
}

function renderHome(){
  const grid = document.getElementById("homeStats");
  const sub = document.getElementById("homeSubtitle");
  const prog = overallProgress();
  const doneToday = todayDoneCount();
  const perfectDays = cycleDates.slice(0, elapsedCount+1).filter(d => (scores[d] ?? 0) === 1).length;
  const totalDone = Math.round(cumulativeDoneCount());
  sub.textContent = cycleFinished ? "Sikl yakunlandi" : `${Math.min(dayIndex+1, CYCLE_LEN)}-kun / ${CYCLE_LEN}`;
  grid.innerHTML = `
    <div class="stat-card"><div class="v">${Math.round(prog*100)}%</div><div class="l">Umumiy progress</div></div>
    <div class="stat-card"><div class="v">${doneToday}/${PRAYERS.length}</div><div class="l">Bugungi namozlar</div></div>
    <div class="stat-card"><div class="v">${perfectDays}</div><div class="l">To'liq bajarilgan kunlar</div></div>
    <div class="stat-card"><div class="v">${totalDone}</div><div class="l">Jami bajarilgan namoz</div></div>
  `;
}

function renderStats(){
  const list = document.getElementById("dayList");
  const days = cycleDates.slice(0, elapsedCount+1);
  if (!days.length){ list.innerHTML = `<div class="empty-note">Hali ma'lumot yo'q</div>`; return; }
  list.innerHTML = days.map(d=>{
    const score = scores[d] ?? 0;
    const n = Math.round(score * PRAYERS.length);
    const pct = Math.round(score*100);
    const isToday = d === todayStr;
    return `<div class="day-row">
      <div class="d${isToday ? ' is-today' : ''}">${displayDate(d)}${isToday ? " (bugun)" : ""}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="n">${n}/${PRAYERS.length}</div>
    </div>`;
  }).reverse().join("");
}

function renderAll(){
  renderList();
  renderTree();
  renderTodayLeaves();
  renderFinish();
  renderHome();
  renderStats();
}

renderAll();
initPrayerTimes();
</script>
