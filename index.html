<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#10142a" />
<title>Kundalik namozlar</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #1c2440 0%, #10142a 55%, #0a0d1c 100%);
    color: #F1EDE3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 18px 40px;
    -webkit-tap-highlight-color: transparent;
  }
  .header { text-align: center; margin-bottom: 4px; }
  .daycount { font-size: 13px; letter-spacing: 0.02em; color: #8B93AB; margin-bottom: 2px; }
  .title { font-size: 26px; font-weight: 800; color: #F2C879; }
  .treewrap { position: relative; width: 220px; height: 230px; margin: 8px 0 6px; }
  .treewrap.glow svg { filter: drop-shadow(0 0 14px rgba(242, 200, 121, 0.55)); }
  .leaf-fall {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 2px 8px 2px 8px;
    background: #7FAE5E;
    top: 60px;
    animation: fall 1.1s ease-in forwards;
    opacity: 0.9;
    pointer-events: none;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(150px) rotate(220deg); opacity: 0; }
  }
  .progress { font-size: 13px; color: #8B93AB; margin-bottom: 18px; text-align: center; }
  .progress b { color: #F1EDE3; }
  .list { width: 100%; max-width: 360px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 4px; border-bottom: 1px solid rgba(241,237,227,0.08);
    cursor: pointer; user-select: none;
  }
  .row:last-child { border-bottom: none; }
  .row-left { display: flex; flex-direction: column; gap: 3px; }
  .row-name { font-size: 17px; font-weight: 600; }
  .row-sub { font-size: 12.5px; color: #8B93AB; }
  .check {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    border: 1.5px solid rgba(241,237,227,0.28);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s ease;
  }
  .check.done { background: #6FA352; border-color: #6FA352; }
  .check svg { width: 16px; height: 16px; display: none; }
  .check.done svg { display: block; }
  .reward {
    margin-top: 18px; padding: 12px 20px; border-radius: 999px;
    background: rgba(242,200,121,0.12); border: 1px solid rgba(242,200,121,0.35);
    color: #F2C879; font-size: 13.5px; font-weight: 600; text-align: center;
  }
  .strip-wrap { width: 100%; max-width: 380px; margin-top: 26px; }
  .strip-label { font-size: 12.5px; color: #8B93AB; margin-bottom: 10px; }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid rgba(241,237,227,0.25);
  }
  .dot.full { background: #6FA352; border-color: #6FA352; }
  .dot.partial { background: #E3A857; border-color: #E3A857; }
  .dot.missed { background: rgba(201,113,74,0.55); border-color: rgba(201,113,74,0.7); }
  .dot.future { background: transparent; }
  .dot.iscurrent { box-shadow: 0 0 0 3px rgba(242,200,121,0.35); }
  .peek { margin-top: 10px; font-size: 12.5px; color: #C9CEDD; text-align: center; min-height: 16px; }
  .finish { margin-top: 20px; text-align: center; max-width: 320px; display: none; }
  .finish h3 { font-size: 19px; margin-bottom: 8px; color: #F2C879; }
  .finish p { font-size: 13.5px; color: #C9CEDD; line-height: 1.5; margin-bottom: 16px; }
  .btn {
    background: #E3A857; color: #10142a; border: none; border-radius: 999px;
    padding: 12px 26px; font-size: 14.5px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="daycount" id="daycount">1-kun / 30</div>
    <div class="title">Kundalik namozlar</div>
  </div>

  <div class="treewrap" id="treewrap">
    <svg viewBox="0 0 220 230" width="220" height="230" id="treesvg"></svg>
  </div>

  <div class="progress" id="progress">Ushbu sikldagi o'sish: <b>0%</b></div>

  <div class="list" id="list"></div>

  <div class="reward" id="reward" style="display:none;">Bugungi mukofot: barcha 5 vaqt namoz to'liq bajarildi</div>

  <div class="finish" id="finish">
    <h3 id="finishTitle">Sikl yakunlandi</h3>
    <p id="finishText"></p>
    <button class="btn" onclick="startNewCycle()">Yangi sikl boshlash</button>
  </div>

  <div class="strip-wrap">
    <div class="strip-label">30 kunlik tarix</div>
    <div class="strip" id="strip"></div>
    <div class="peek" id="peek"></div>
  </div>

<script>
const PRAYERS = [
  { key: "bomdod", label: "Bomdod" },
  { key: "peshin", label: "Peshin" },
  { key: "asr", label: "Asr" },
  { key: "shom", label: "Shom" },
  { key: "xufton", label: "Xufton" },
];
const CYCLE_LEN = 30;
const EMPTY_RECORD = { bomdod:false, peshin:false, asr:false, shom:false, xufton:false };
const LEAF_SPOTS = [
  { x: 0, y: -8, r: 20 },
  { x: -16, y: -2, r: 16 },
  { x: 16, y: -2, r: 16 },
  { x: -8, y: -22, r: 15 },
  { x: 8, y: -22, r: 15 },
  { x: -26, y: -10, r: 13 },
  { x: 26, y: -10, r: 13 },
  { x: 0, y: -30, r: 13 },
  { x: -14, y: -36, r: 11 },
  { x: 14, y: -36, r: 11 },
  { x: -32, y: 2, r: 11 },
  { x: 32, y: 2, r: 11 },
  { x: 0, y: 6, r: 12 },
];
const STAGE_TRUNK = [28, 50, 72, 94, 116];
const STAGE_CANOPY_COUNT = [3, 6, 9, 11, 13];
const STAGE_CANOPY_SCALE = [0.55, 0.68, 0.8, 0.9, 1.0];

function fmt(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function daysBetween(a,b){ const MS=86400000; const da=new Date(a.getFullYear(),a.getMonth(),a.getDate()); const db=new Date(b.getFullYear(),b.getMonth(),b.getDate()); return Math.round((db-da)/MS); }
function displayDate(s){ const [y,m,d]=s.split("-"); return `${d}.${m}.${y}`; }

function loadRecord(dateStr){
  try { const raw = localStorage.getItem("day:"+dateStr); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveRecord(dateStr, rec){
  try { localStorage.setItem("day:"+dateStr, JSON.stringify(rec)); } catch(e){}
}
function getCycleStart(todayStr){
  let s = localStorage.getItem("meta:cycle-start");
  if (!s) { s = todayStr; localStorage.setItem("meta:cycle-start", s); }
  return s;
}
function setCycleStart(s){ localStorage.setItem("meta:cycle-start", s); }

let today = new Date();
let todayStr = fmt(today);
let cycleStart = getCycleStart(todayStr);
let cycleStartDate = (()=>{ const [y,m,d]=cycleStart.split("-").map(Number); return new Date(y,m-1,d); })();
let dayIndex = daysBetween(cycleStartDate, today);
let cycleFinished = dayIndex >= CYCLE_LEN;
let elapsedCount = Math.min(dayIndex, CYCLE_LEN-1);
let cycleDates = Array.from({length:CYCLE_LEN}, (_,i)=>fmt(addDays(cycleStartDate,i)));
let todayRecord = loadRecord(todayStr) || {...EMPTY_RECORD};
let scores = {};
cycleDates.slice(0, elapsedCount+1).forEach(d=>{
  const rec = d===todayStr ? todayRecord : loadRecord(d);
  const done = rec ? PRAYERS.filter(p=>rec[p.key]).length : 0;
  scores[d] = done / PRAYERS.length;
});
let peekDate = null;

function overallProgress(){
  let sum = 0;
  cycleDates.forEach((d,i)=>{
    if (i > elapsedCount && d !== todayStr) return;
    sum += scores[d] ?? 0;
  });
  return sum / CYCLE_LEN;
}

function todayDoneCount(){ return PRAYERS.filter(p=>todayRecord[p.key]).length; }

function renderTree(){
  const prog = overallProgress();
  const stage = Math.min(4, Math.floor(prog*5));
  const trunkH = STAGE_TRUNK[stage];
  const canopyCount = STAGE_CANOPY_COUNT[stage];
  const scale = STAGE_CANOPY_SCALE[stage];
  const canopyTone = ["#8FB86A","#7FAE5E","#6FA352","#5F9848","#548C3E"][stage];
  const canopyToneDark = ["#6E9A52","#5F9848","#548C3E","#457A32","#3B6E29"][stage];
  const showFruit = cycleFinished && prog >= 0.85;
  const baseY = 210;
  const trunkTopY = baseY - trunkH;
  const trunkW = 8 + stage*1.5;

  const spots = LEAF_SPOTS.slice(0, canopyCount);

  let svg = `<ellipse cx="110" cy="214" rx="66" ry="9" fill="#0d1120" opacity="0.55" />`;
  // little root flare + trunk
  svg += `<path d="M ${110-trunkW/2-4} ${baseY} Q ${110-trunkW/2} ${baseY-10} ${110-trunkW/2} ${trunkTopY+trunkH*0.15}
           L ${110-trunkW/2} ${trunkTopY} L ${110+trunkW/2} ${trunkTopY}
           L ${110+trunkW/2} ${trunkTopY+trunkH*0.15} Q ${110+trunkW/2} ${baseY-10} ${110+trunkW/2+4} ${baseY} Z"
           fill="#7A5A3C" />`;
  svg += `<rect x="${110-trunkW*0.15}" y="${trunkTopY}" width="${trunkW*0.3}" height="${trunkH*0.9}" fill="#8C6B47" opacity="0.5" />`;

  // back layer (darker) then front layer (lighter) for depth
  spots.forEach(spot=>{
    const r = spot.r * scale * 0.72;
    svg += `<circle cx="${110+spot.x*scale*1.15}" cy="${trunkTopY+spot.y*scale}" r="${r}" fill="${canopyToneDark}" opacity="0.85" />`;
  });
  spots.forEach(spot=>{
    const r = spot.r * scale;
    svg += `<circle cx="${110+spot.x*scale}" cy="${trunkTopY+spot.y*scale-3}" r="${r}" fill="${canopyTone}" opacity="0.96" />`;
  });
  if (showFruit){
    spots.forEach((spot,i)=>{
      if (i%2===0) svg += `<circle cx="${110+spot.x*scale+5}" cy="${trunkTopY+spot.y*scale+3}" r="4.5" fill="#F2C879" />`;
    });
  }
  document.getElementById("treesvg").innerHTML = svg;
  document.getElementById("treewrap").classList.toggle("glow", !cycleFinished && todayDoneCount()===PRAYERS.length);
  document.getElementById("progress").innerHTML = `Ushbu sikldagi o'sish: <b>${Math.round(prog*100)}%</b>`;
  document.getElementById("daycount").textContent = `${Math.min(dayIndex+1, CYCLE_LEN)}-kun / ${CYCLE_LEN}`;
}

function dropLeaf(){
  const el = document.createElement("div");
  el.className = "leaf-fall";
  const x = -30 + Math.random()*60;
  el.style.left = `calc(50% + ${x}px)`;
  document.getElementById("treewrap").appendChild(el);
  el.addEventListener("animationend", ()=> el.remove());
}

function togglePrayer(key){
  const was = !!todayRecord[key];
  todayRecord = {...todayRecord, [key]: !was};
  scores[todayStr] = todayDoneCount()/PRAYERS.length;
  saveRecord(todayStr, todayRecord);
  if (was) dropLeaf();
  renderList();
  renderTree();
  renderStrip();
}

function renderList(){
  const list = document.getElementById("list");
  const reward = document.getElementById("reward");
  if (cycleFinished){ list.style.display="none"; reward.style.display="none"; return; }
  list.style.display = "block";
  list.innerHTML = PRAYERS.map(p=>{
    const done = !!todayRecord[p.key];
    return `<div class="row" onclick="togglePrayer('${p.key}')">
      <div class="row-left">
        <div class="row-name">${p.label}</div>
        <div class="row-sub">${done ? "Bajardim" : "Bajarmadim"}</div>
      </div>
      <div class="check${done?' done':''}">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#10142a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>`;
  }).join("");
  reward.style.display = todayDoneCount()===PRAYERS.length ? "block" : "none";
}

function dotClassFor(d,i){
  if (i > elapsedCount && d !== todayStr) return "future";
  const s = d===todayStr ? todayDoneCount()/PRAYERS.length : (scores[d] ?? 0);
  if (s >= 1) return "full";
  if (s > 0) return "partial";
  return "missed";
}

function renderStrip(){
  const strip = document.getElementById("strip");
  strip.innerHTML = cycleDates.map((d,i)=>{
    const cls = dotClassFor(d,i) + (d===todayStr ? " iscurrent" : "");
    return `<div class="dot ${cls}" title="${displayDate(d)}" onclick="peekDay('${d}')"></div>`;
  }).join("");
  renderPeek();
}
function peekDay(d){ peekDate = d; renderPeek(); }
function renderPeek(){
  const el = document.getElementById("peek");
  if (!peekDate){ el.textContent = ""; return; }
  const n = peekDate===todayStr ? todayDoneCount() : Math.round((scores[peekDate]??0)*5);
  el.textContent = `${displayDate(peekDate)}: ${n}/5 namoz bajarilgan`;
}

function renderFinish(){
  const finish = document.getElementById("finish");
  if (!cycleFinished){ finish.style.display = "none"; return; }
  finish.style.display = "block";
  const prog = overallProgress();
  document.getElementById("finishTitle").textContent = prog >= 0.85 ? "Tabriklaymiz!" : "Sikl yakunlandi";
  document.getElementById("finishText").textContent = prog >= 0.85
    ? "30 kunlik sikl davomida daraxtingiz to'liq o'sib, mevaga kirdi. Yangi sikl bilan davom eting."
    : "30 kunlik sikl yakunlandi. Daraxt ushbu davrdagi bajarilgan namozlar asosida o'sdi. Yangi sikldan yana boshlashingiz mumkin.";
}

function startNewCycle(){
  setCycleStart(todayStr);
  cycleStart = todayStr;
  cycleStartDate = today;
  dayIndex = 0;
  cycleFinished = false;
  elapsedCount = 0;
  cycleDates = Array.from({length:CYCLE_LEN}, (_,i)=>fmt(addDays(cycleStartDate,i)));
  todayRecord = {...EMPTY_RECORD};
  scores = { [todayStr]: 0 };
  peekDate = null;
  renderAll();
}

function renderAll(){
  renderList();
  renderTree();
  renderStrip();
  renderFinish();
}

renderAll();
</script>
</body>
</html>
